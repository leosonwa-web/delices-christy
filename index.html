<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F7A17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Christy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Les délices de Christy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8EF; --ink:#16231D; --muted:#55655D; --line:#DDE3DE; --card:#FFFFFF;
  --accent:#4F7A17; --accent-t:#EBF3D9; --ok-bg:#E8F1D3; --ok:#3B5A0F;
  --warn-bg:#FDE8D5; --warn-line:#F1C7A0; --warn:#9A3F0C; --neutral-bg:#E3E7E4;
  --head:'Bricolage Grotesque',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:inherit;text-decoration:none}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
main{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 28px;display:flex;flex-direction:column;gap:14px}
nav{display:flex;flex-shrink:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer}
nav button.on{color:var(--accent);font-weight:700}
h1{margin:0;font:700 30px/1.15 var(--head)}
h2{margin:0;font:600 19px/1.2 var(--head)}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.card.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat .lbl{font-size:13px;color:var(--muted)}
.stat .val{font:700 28px/1.2 var(--head)}
.stat .sub{font-size:12px;color:var(--muted)}
.card.warn .lbl,.card.warn .sub{color:var(--warn)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 16px}
.item{display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;padding:0;text-align:left;cursor:pointer}
.list > :last-child{border-bottom:0}
.item.static{cursor:default}
.avatar{width:40px;height:40px;border-radius:20px;background:var(--accent-t);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.avatar.big{width:52px;height:52px;border-radius:26px;font-size:18px}
.name{font-size:16px;font-weight:500}
.neg{color:var(--warn);font-weight:700} .pos{color:var(--accent);font-weight:700}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--warn-bg);color:var(--warn)} .pill.neutral{background:var(--neutral-bg);color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:14px;border:2px solid var(--accent);background:#fff;color:var(--accent);font-weight:700;font-size:16px;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn.small{min-height:44px;padding:0 14px;font-size:14px;border-radius:10px}
.btn[disabled],.btn.disabled{opacity:.45;pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border:1px solid #C9D1CC;border-radius:999px;background:#fff;color:#3E4C45;font-size:14px;font-weight:500;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500}
.field input,.field select,.field textarea{width:100%;height:52px;padding:0 14px;border:1px solid #C9D1CC;border-radius:12px;background:#fff}
.search{position:relative}
.search svg{position:absolute;left:14px;top:16px}
.search input{width:100%;height:52px;padding:0 16px 0 44px;border:1px solid #C9D1CC;border-radius:14px;background:#fff}
.back{display:flex;align-items:center;gap:4px;min-height:44px;color:var(--accent);font-weight:700;font-size:15px;background:none;border:0;padding:0;cursor:pointer;align-self:flex-start}
.chipbtn{display:flex;align-items:center;gap:4px;min-height:44px;margin:-12px 0;padding:0 12px;border:1px solid #C9D1CC;border-radius:999px;background:#fff;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.roundbtn{width:44px;height:44px;border:1px solid #C9D1CC;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.absbtn{min-height:44px;padding:0 12px;border:1px solid #C9D1CC;border-radius:10px;background:#fff;color:#3E4C45;font-size:13px;font-weight:500;cursor:pointer}
.absbtn.on{border:2px solid #55655D;background:var(--neutral-bg);color:var(--ink);font-weight:700}
.logo{width:84px;height:65px;object-fit:contain;border-radius:10px;flex-shrink:0}
.overlay{position:fixed;inset:0;background:rgba(22,35,29,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:#fff;border-radius:20px 20px 0 0;z-index:21;padding-bottom:env(safe-area-inset-bottom)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 4px}
.sheet-b{padding:8px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet-f{display:flex;gap:10px;padding:12px 20px 16px}
.sheet-f .btn{flex:1}
.x{width:44px;height:44px;border:0;background:none;font-size:28px;line-height:1;color:var(--muted);cursor:pointer}
.err{color:var(--warn);font-size:14px;font-weight:700;padding:0 20px;min-height:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.hist .item{min-height:56px}
.strike{text-decoration:line-through;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px;background:#C9D1CC}
.dot.ok{background:var(--accent)} .dot.bad{background:var(--warn)}
</style>
</head>

    while (d <= y.fin && guard++ < 800) {

      d = addDays(d, 1);
    }
  });
  days.sort();
  var prix = Object.values(S.prix).sort(function (a, b) { return a.depuis < b.depuis ? -1 : 1; });
  var price = {};
  days.forEach(function (d) { var m = 0; for (var i = 0; i < prix.length; i++) { if (prix[i].depuis <= d) m = prix[i].montant; } price[d] = m; });
  var vers = {};
  Object.values(S.versements).forEach(function (v) { (vers[v.eleve] = vers[v.eleve] || []).push(v); });
  cache = { days: days, price: price, vers: vers, prix: prix };
  return cache;
}
function priceOn(d) {
  var p = ctx().prix, m = 0;
  for (var i = 0; i < p.length; i++) { if (p[i].depuis <= d) m = p[i].montant; }
  return m;
}
function currentPrice() { return priceOn(todayISO()); }
function dayInfo(d) {
  var y = yearsList();
  if (!y.length) return { school: false, reason: 'Les dates de l’année scolaire ne sont pas encore entrées', code: 'noyear' };
  if (!y.some(function (a) { return d >= a.debut && d <= a.fin; })) return { school: false, reason: 'Hors année scolaire', code: 'outside' };
  if (isWeekend(d)) return { school: false, reason: 'Week-end', code: 'weekend' };
  var c = Object.values(S.joursFermes).filter(function (c) { return d >= c.debut && d <= (c.fin || c.debut); })[0];
  if (c) return { school: false, reason: 'Jour sans repas' + (c.motif ? ' : ' + c.motif : ''), code: 'closed' };
  return { school: true, reason: '', code: 'ok' };
}
function isAbs(d, id) { return !!(S.absences[d] && S.absences[d][id]); }
function eleveActiveOn(e, d) { return (e.depuis || '0000-00-00') <= d && (!e.retireLe || d < e.retireLe); }
function activeStudents(d) { return Object.values(S.eleves).filter(function (e) { return eleveActiveOn(e, d); }); }
function isRetired(e) { return !!e.retireLe && e.retireLe <= todayISO(); }
function balanceOf(e, upTo) {
  var c = ctx(), verse = 0, debit = 0, repas = 0, abs = 0, i;
  var vs = c.vers[e.id] || [];
  for (i = 0; i < vs.length; i++) { if (!vs[i].annule && vs[i].date <= upTo) verse += vs[i].montant; }
  var from = e.depuis || '0000-00-00', to = e.retireLe;
  for (i = 0; i < c.days.length; i++) {
    var d = c.days[i];
    if (d > upTo) break;
    if (d < from) continue;
    if (to && d >= to) break;
    if (isAbs(d, e.id)) { abs++; continue; }
    debit += c.price[d]; repas++;
  }
  return { solde: verse - debit, verse: verse, debit: debit, repas: repas, abs: abs };
}
function historyOf(e) {
  var t = todayISO(), c = ctx(), ev = [], i;
  (c.vers[e.id] || []).forEach(function (v) { if (v.date <= t) ev.push({ date: v.date, k: 0, type: 'v', v: v }); });
  var from = e.depuis || '0000-00-00', to = e.retireLe;
  for (i = 0; i < c.days.length; i++) {
    var d = c.days[i];
    if (d > t) break;
    if (d < from) continue;
    if (to && d >= to) break;
    ev.push({ date: d, k: 1, type: isAbs(d, e.id) ? 'abs' : 'meal', amt: c.price[d] });
  }
  ev.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.k - b.k; });
  var run = 0;
  ev.forEach(function (x) {
    if (x.type === 'v') { if (!x.v.annule) run += x.v.montant; }
    else if (x.type === 'meal') run -= x.amt;

}
function waLink(e, solde) {
  var d = String(e.tel || '').replace(/[^\d]/g, '');

  if (d.length === 9) d = '237' + d;
  if (d.length < 8) return '';
  var prenom = String(e.nom || '').split(/\s+/)[0];
  var msg = 'Bonjour, le compte de ' + prenom + ' est à ' + fcfa(solde) + '. Merci de faire un versement. – Les délices de Christy';
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent(msg);
}

    '<div class="col" style="align-items:center"><div style="font-size:17px;font-weight:700">' + esc(fmtDate(d, true)) + '</div>' +
    '<div class="small" style="color:var(--accent);font-weight:700">' + (info.school ? (act.length - abs) + ' repas · ' + abs + ' absent' + (abs > 1 ? 's' : '') : esc(info.reason)) + '</div></div>' +
    '<button type="button" class="roundbtn" data-act="day-next" aria-label="Jour suivant">' + IC.right + '</button></div>' +
    '<div class="row" style="gap:10px"><div class="field grow"><input id="meal-date" type="date" value="' + esc(d) + '" aria-label="Choisir une date"></div>' +
    (d !== t ? '<button type="button" class="btn small" data-act="day-today">Aujourd’hui</button>' : '') + '</div>' +
    '<div class="search">' + IC.search + '<input id="mq" type="search" placeholder="Chercher un élève" aria-label="Chercher un élève" value="' + esc(ui.mq) + '"></div>' +
    '<div class="chips">' + chip('tous', 'Tous') + chip('dette', 'À payer') + chip('abs', 'Absents') + '</div>' +
    '<div id="mlist">' + mealListHtml() + '</div>';
}

/* ---------- Année scolaire ---------- */
function viewYear() {
  var y = currentYear(), closed = Object.values(S.joursFermes).sort(function (a, b) { return a.debut < b.debut ? -1 : 1; });
  var info = y && validISO(y.debut) && validISO(y.fin) ? '<div class="card"><div class="small muted">Première livraison</div><div class="name">' + esc(fmtDay(y.debut)) + '</div><div class="small muted" style="margin-top:8px">Dernier jour d’école</div><div class="name">' + esc(fmtDay(y.fin)) + '</div></div>' :
    '<div class="card warn small">Les dates ne sont pas encore entrées : personne n’est débité.</div>';
  return '<button type="button" class="back" data-act="nav" data-v="settings">' + IC.left + 'Réglages</button>' +
    '<div class="col" style="gap:2px"><h1>Année scolaire</h1><div class="muted small">Les repas ne sont débités qu’entre ces deux dates, sans les week-ends ni les jours sans repas.</div></div>' +
    '<div class="card"><div class="row between"><div style="font:700 22px var(--head)">' + esc(yearLabel(y)) + '</div>' + (y ? '<span class="pill ok">En cours</span>' : '') + '</div></div>' + info +
    '<button type="button" class="btn primary" data-act="edit-year">' + (y ? 'Modifier les dates' : 'Entrer les dates') + '</button>' +
    '<div class="row between"><h2>Jours sans repas</h2><button type="button" class="btn small" data-act="add-closed">' + IC.plus + 'Ajouter</button></div>' +
    '<div class="small muted">Les week-ends sont automatiques. Ajoute les jours fériés et les vacances.</div>' +
    (closed.length ? '<div class="list">' + closed.map(function (c) {
      var rng = c.fin && c.fin !== c.debut ? 'Du ' + fmtDate(c.debut) + ' au ' + fmtDate(c.fin) : fmtDate(c.debut, true);
      return '<div class="item static"><div class="col grow"><div class="name">' + esc(c.motif || 'Jour sans repas') + '</div><div class="small muted">' + esc(rng) + '</div></div><button type="button" class="btn small danger" data-act="del-closed" data-id="' + esc(c.id) + '">Supprimer</button></div>';
    }).join('') + '</div>' : '<div class="card small muted">Aucun jour sans repas noté.</div>');
}

/* ---------- Réglages ---------- */
function viewSettings() {
  var sl = syncLabel();
  return '<div class="col" style="gap:2px"><h1>Réglages</h1></div>' +
    '<div class="card"><div class="row between"><div class="col"><div class="small muted">Prix d\u2019un repas</div><div style="font:700 26px var(--head);color:var(--accent)">' + fcfa(currentPrice()) + '</div></div>' +
    '<button type="button" class="btn small" data-act="edit-price">Modifier</button></div>' +
    '<div class="small muted" style="margin-top:8px">Si tu changes le prix, les repas déjà passés gardent l\u2019ancien prix.</div></div>' +
    '<button type="button" class="card row between" style="width:100%;text-align:left;cursor:pointer" data-act="go-year"><div class="col"><div class="name">Année scolaire</div><div class="small muted">Dates de l\u2019année et jours sans repas</div></div>' + IC.right + '</button>' +
    '<div class="card small"><span class="dot ' + sl.cls + '"></span>' + esc(sl.txt) + '</div>' +
    '<button type="button" class="card row between" style="width:100%;text-align:left;cursor:pointer" data-act="go-admin"><div class="col"><div class="name">Admin</div><div class="small muted">Sauvegarde, synchronisation, version</div></div>' + IC.right + '</button>';
}
function viewAdmin() {
  var sl = syncLabel(), lastB = localStorage.getItem(LS_BACKUP);
  return '<button type="button" class="back" data-act="nav" data-v="settings">' + IC.left + 'Réglages</button>' +
    '<div class="col" style="gap:2px"><h1>Admin</h1><div class="muted small">Réglages pour l\u2019administrateur. Version ' + esc(APP_VERSION) + '</div></div>' +
    '<div class="card col" style="gap:10px"><div class="name">Sauvegarde</div><div class="small muted">' + (lastB ? 'Dernière sauvegarde faite depuis ce téléphone : ' + esc(fmtDay(lastB)) + '.' : 'Aucune sauvegarde faite depuis ce téléphone.') + (FIREBASE_CONFIG ? ' Une copie automatique est faite chaque semaine sur GitHub.' : '') + '</div>' +
    '<div class="row" style="gap:10px"><button type="button" class="btn primary grow small" data-act="export">Télécharger</button><button type="button" class="btn grow small" data-act="share">Partager</button></div>' +
    '<button type="button" class="btn small" data-act="import-click">Restaurer depuis un fichier</button>' +
    '<input id="import-file" type="file" accept="application/json,.json" style="display:none"></div>' +
    '<div class="card col" style="gap:8px"><div class="name">Synchronisation</div><div class="small"><span class="dot ' + sl.cls + '"></span>' + esc(sl.txt) + '</div>' +
    (FIREBASE_CONFIG ? '<button type="button" class="btn small" data-act="sync-now">Synchroniser maintenant</button>' : '<div class="small muted">Pour activer Firebase, colle la configuration au début du fichier index.html.</div>') + '</div>';
}

/* =====================================================================
   FEUILLES (formulaires)
   ===================================================================== */
function openSheet(title, bodyHtml, o) {
  o = o || {};
  closeSheet();
  sheetRoot.innerHTML = '<div class="overlay" data-act="sheet-close"></div><form class="sheet" id="sheet-form" novalidate role="dialog" aria-label="' + esc(title) + '">' +
    '<div class="sheet-h"><h2>' + esc(title) + '</h2><button type="button" class="x" data-act="sheet-close" aria-label="Fermer">×</button></div>' +
    '<div class="sheet-b">' + bodyHtml + '</div><div class="err" id="sheet-err" role="alert"></div>' +
    '<div class="sheet-f"><button type="button" class="btn" data-act="sheet-close">Annuler</button><button type="submit" class="btn ' + (o.danger ? 'danger' : 'primary') + '">' + esc(o.label || 'Enregistrer') + '</button></div></form>';
  var form = document.getElementById('sheet-form');
  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var r = o.onSubmit ? o.onSubmit(new FormData(form)) : null;
    if (typeof r === 'string') { document.getElementById('sheet-err').textContent = r; return; }
    closeSheet();
  });
  if (o.onOpen) o.onOpen();
  var first = form.querySelector('input:not([type=hidden]),select');
  if (first && !o.noFocus) setTimeout(function () { try { first.focus(); } catch (e) { /* ignore */ } }, 50);
}
function closeSheet() {
  sheetRoot.innerHTML = '';
  if (needsRefresh) render();
}
function field(id, label, html) { return '<div class="field"><label for="' + id + '">' + label + '</label>' + html + '</div>'; }
function input(id, type, val, extra) { return '<input id="' + id + '" name="' + id + '" type="' + type + '" value="' + esc(val == null ? '' : val) + '" ' + (extra || '') + '>'; }
function confirmSheet(title, msg, label, fn) {
  openSheet(title, '<div>' + esc(msg) + '</div>', { label: label, danger: true, noFocus: true, onSubmit: function () { fn(); return null; } });
}

function studentForm(e) {
  var edit = !!e, t = todayISO();
  var body = field('nom', 'Nom de l’élève', input('nom', 'text', e ? e.nom : '', 'autocomplete="off" placeholder="Prénom et initiale du nom"')) +
    field('classe', 'Classe', input('classe', 'text', e ? e.classe : '', 'autocomplete="off" placeholder="Ex. 6B, CM2"')) +
    field('tel', 'Téléphone du parent (WhatsApp)', input('tel', 'tel', e ? e.tel : '', 'autocomplete="off" placeholder="Ex. 6 12 34 56 78"')) +
    field('note', 'Remarque (allergie, etc.)', input('note', 'text', e ? e.note : '', 'autocomplete="off"')) +
    field('depuis', 'Repas débités à partir du', input('depuis', 'date', e ? e.depuis : t));
  if (!edit) {
    body += '<div class="row" style="gap:10px;align-items:flex-end"><div class="field grow">' + '<label for="solde">Solde de départ (FCFA)</label>' + input('solde', 'text', '', 'inputmode="numeric" placeholder="0"') + '</div>' +
      '<div class="field" style="width:130px"><label for="sens">Sens</label><select id="sens" name="sens"><option value="+">Crédit</option><option value="-">Dette</option></select></div></div>' +
      '<div class="small muted">Utile pour les élèves qui ont déjà payé ou qui doivent encore de l’argent.</div>';
  } else {
    var retired = isRetired(e);
    body += '<button type="button" class="btn ' + (retired ? '' : 'danger') + '" data-act="' + (retired ? 'unretire' : 'retire') + '" data-id="' + esc(e.id) + '">' + (retired ? 'Remettre l’élève dans la liste' : 'Retirer l’élève (il reste dans l’historique)') + '</button>';
  }
  openSheet(edit ? 'Modifier l’élève' : 'Nouvel élève', body, {
    onSubmit: function (fd) {
      var nom = String(fd.get('nom') || '').trim(), depuis = String(fd.get('depuis') || '');
      if (!nom) return 'Entre le nom de l’élève.';
      if (!validISO(depuis)) return 'La date de départ n’est pas valide.';
      var dup = Object.values(S.eleves).some(function (x) { return (!e || x.id !== e.id) && norm(x.nom) === norm(nom) && norm(x.classe) === norm(fd.get('classe')); });
      if (dup) return 'Un élève avec ce nom et cette classe existe déjà.';
      var id = e ? e.id : uid();
      var rec = Object.assign({}, e || {}, { id: id, nom: nom, classe: String(fd.get('classe') || '').trim(), tel: String(fd.get('tel') || '').trim(), note: String(fd.get('note') || '').trim(), depuis: depuis });
      if (!e) {
        var s = String(fd.get('solde') || '').trim(), amt = s ? parseAmount(s) : 0;
        if (s && isNaN(amt)) return 'Le solde de départ doit être un nombre.';
        commit(['eleves', id], rec);
        if (amt) { var vid = uid(); commit(['versements', vid], { id: vid, eleve: id, date: depuis, montant: fd.get('sens') === '-' ? -amt : amt, type: 'depart', note: '' }); }
        toast(nom + ' ajouté(e).');
      } else { commit(['eleves', id], rec); toast('Modifications enregistrées.'); }
      render(); return null;
    }
  });
}
function versementForm(eleveId) {
  var e = S.eleves[eleveId]; if (!e) return;
  openSheet('Versement pour ' + e.nom, field('montant', 'Montant reçu (FCFA)', input('montant', 'text', '', 'inputmode="numeric" autocomplete="off" placeholder="Ex. 6000"')) +
    field('date', 'Date', input('date', 'date', todayISO(), 'max="' + todayISO() + '"')) +
    field('note', 'Remarque (facultatif)', input('note', 'text', '', 'autocomplete="off" placeholder="Ex. 1 semaine, espèces"')) +
    '<div class="small muted">Solde actuel : ' + fcfa(balanceOf(e, todayISO()).solde) + '</div>', {
    onSubmit: function (fd) {
      var amt = parseAmount(fd.get('montant')), date = String(fd.get('date') || '');
      if (isNaN(amt) || amt <= 0) return 'Entre un montant supérieur à 0.';
      if (!validISO(date) || date > todayISO()) return 'La date ne peut pas être dans le futur.';
      var id = uid();
      commit(['versements', id], { id: id, eleve: eleveId, date: date, montant: amt, type: 'versement', note: String(fd.get('note') || '').trim() });
      toast('Versement de ' + fcfa(amt) + ' ajouté à ' + e.nom + '.');
      V.name = 'student'; V.id = eleveId; render(); return null;
    }
  });
}
function pickStudentSheet() {
  var body = '<div class="search">' + IC.search + '<input id="pick-q" type="search" placeholder="Chercher un élève" autocomplete="off"></div><div id="pick-list"></div>';
  function list() {
    var q = norm(document.getElementById('pick-q').value);
    var rows = Object.values(S.eleves).filter(function (e) { return !isRetired(e) && (!q || norm(e.nom + ' ' + (e.classe || '')).indexOf(q) >= 0); })
      .sort(function (a, b) { return norm(a.nom) < norm(b.nom) ? -1 : 1; }).slice(0, 40);
    document.getElementById('pick-list').innerHTML = rows.length ? '<div class="list">' + rows.map(function (e) {
      return '<button type="button" class="item" data-act="pick-eleve" data-id="' + esc(e.id) + '"><div class="avatar">' + esc(initials(e.nom)) + '</div><div class="col grow"><div class="name">' + esc(e.nom) + '</div><div class="small muted">' + esc(e.classe || '') + '</div></div></button>';
    }).join('') + '</div>' : '<div class="small muted">Aucun élève trouvé.</div>';
  }
  openSheet('Pour quel élève ?', body, { label: 'Fermer', onSubmit: function () { return null; }, onOpen: function () {
    list(); document.getElementById('pick-q').addEventListener('input', list);
  } });
}
function priceForm() {
  openSheet('Prix d’un repas', field('montant', 'Nouveau prix (FCFA)', input('montant', 'text', currentPrice(), 'inputmode="numeric"')) +
    field('depuis', 'À partir du', input('depuis', 'date', todayISO())) +
    '<div class="small muted">Les repas avant cette date gardent l’ancien prix.</div>', {
    onSubmit: function (fd) {
      var amt = parseAmount(fd.get('montant')), d = String(fd.get('depuis') || '');
      if (isNaN(amt) || amt <= 0) return 'Entre un prix supérieur à 0.';
      if (!validISO(d)) return 'La date n’est pas valide.';
      var same = Object.values(S.prix).filter(function (p) { return p.depuis === d; })[0];
      var id = same ? same.id : uid();
      commit(['prix', id], { id: id, depuis: d, montant: amt });
      toast('Prix du repas : ' + fcfa(amt) + ' à partir du ' + fmtDay(d) + '.'); render(); return null;
    }
  });
}
function yearForm() {
  var y = currentYear(), n = new Date().getFullYear();
  openSheet('Dates de l’année scolaire', field('debut', 'Première livraison', input('debut', 'date', y ? y.debut : '')) +
    field('fin', 'Dernier jour d’école', input('fin', 'date', y ? y.fin : '')) +
    '<div class="small muted">Tu peux modifier ces dates plus tard (par exemple si la rentrée est décalée).</div>', {
    onSubmit: function (fd) {
      var a = String(fd.get('debut') || ''), b = String(fd.get('fin') || '');
      if (!validISO(a) || !validISO(b)) return 'Entre les deux dates.';
      if (b <= a) return 'Le dernier jour doit être après la première livraison.';
      if (daysBetween(a, b) > 400) return 'Cette période est trop longue pour une année scolaire.';
      var id = y ? y.id : uid();
      commit(['annees', id], { id: id, label: a.slice(0, 4) + '–' + b.slice(0, 4), debut: a, fin: b });
      toast('Dates enregistrées.'); render(); return null;
    }
  });
}
function closedForm() {
  openSheet('Jours sans repas', field('debut', 'Du', input('debut', 'date', '')) +
    field('fin', 'Au (si plusieurs jours, sinon laisser vide)', input('fin', 'date', '')) +
    field('motif', 'Motif', input('motif', 'text', '', 'autocomplete="off" placeholder="Ex. Fête nationale, vacances de Noël"')), {
    onSubmit: function (fd) {
      var a = String(fd.get('debut') || ''), b = String(fd.get('fin') || '') || a;
      if (!validISO(a)) return 'Entre la date de début.';
      if (!validISO(b) || b < a) return 'La date de fin doit être après la date de début.';
      var id = uid();
      commit(['joursFermes', id], { id: id, debut: a, fin: b, motif: String(fd.get('motif') || '').trim() });
      toast('Jour sans repas ajouté.'); render(); return null;
    }
  });
}

/* ---------- Sauvegarde ---------- */
function backupBlob() {
  var payload = { app: 'delices-de-christy', version: 1, exportedAt: new Date().toISOString(), data: S };
  return new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
}
function backupName() { return 'christy-sauvegarde-' + todayISO() + '.json'; }
function markBackup() { try { localStorage.setItem(LS_BACKUP, todayISO()); } catch (e) { /* ignore */ } }
function doExport() {
  var url = URL.createObjectURL(backupBlob()), a = document.createElement('a');
  a.href = url; a.download = backupName(); document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  markBackup(); toast('Sauvegarde téléchargée.'); render();
}
function doShare() {
  var file;
  try { file = new File([backupBlob()], backupName(), { type: 'application/json' }); } catch (e) { return doExport(); }
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: 'Sauvegarde Les délices de Christy' }).then(function () { markBackup(); render(); }).catch(function () { /* annulé */ });
  } else { doExport(); }
}
function doImport(file) {
  var r = new FileReader();
  r.onload = function () {
    var obj;
    try { obj = JSON.parse(r.result); } catch (e) { return toast('Ce fichier n’est pas une sauvegarde valide.'); }
    var data = obj && obj.data ? obj.data : obj;
    if (!data || typeof data !== 'object' || !data.eleves) return toast('Ce fichier n’est pas une sauvegarde valide.');
    var n = Object.keys(data.eleves).length;
    confirmSheet('Restaurer la sauvegarde ?', 'Toutes les données actuelles seront remplacées par celles du fichier (' + n + ' élève' + (n > 1 ? 's' : '') + '). Cette action ne peut pas être annulée.', 'Restaurer', function () {
      S = normalizeState(data); touch();
      if (FIREBASE_CONFIG) pending = [{ p: '__root', v: S }]; else pending = [];
      ensureDefaultsSafe(); saveLocal(); sync(); toast('Sauvegarde restaurée.'); render();
    });
  };
  r.readAsText(file);
}

/* =====================================================================
   ÉVÉNEMENTS
   ===================================================================== */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), v = el.getAttribute('data-v');
  switch (act) {
    case 'nav': ev.preventDefault(); go(v); break;
    case 'go-year': go('year'); break;
    case 'go-admin': go('admin'); break;
    case 'go-admin': go('admin'); break;
    case 'go-meals': go('meals'); break;
    case 'open-student': go('student', id); ui.histN = 40; break;
    case 'add-student': studentForm(null); break;
    case 'edit-student': studentForm(S.eleves[id]); break;
    case 'add-versement': if (id) versementForm(id); else pickStudentSheet(); break;
    case 'pick-eleve': closeSheet(); versementForm(id); break;
    case 'cancel-versement':
      var vv = S.versements[id]; if (!vv) break;
      confirmSheet('Annuler ce versement ?', 'Le versement de ' + fcfa(vv.montant) + ' du ' + fmtDay(vv.date) + ' sera marqué comme annulé. Il reste visible dans l’historique mais n’est plus compté.', 'Annuler le versement', function () {
        commit(['versements', id], Object.assign({}, vv, { annule: true })); toast('Versement annulé.'); render();
      }); break;
    case 'retire':
      var er = S.eleves[id]; if (!er) break;
      closeSheet();
      confirmSheet('Retirer ' + er.nom + ' ?', 'Il ne sera plus débité à partir d’aujourd’hui et disparaîtra de la liste du jour. Son historique et son solde restent consultables.', 'Retirer', function () {
        commit(['eleves', id], Object.assign({}, er, { retireLe: todayISO() })); toast(er.nom + ' retiré(e).'); render();
      }); break;
    case 'unretire':
      var eu = S.eleves[id]; if (!eu) break;
      var rec = Object.assign({}, eu); delete rec.retireLe;
      commit(['eleves', id], rec); closeSheet(); toast(eu.nom + ' est de nouveau dans la liste.'); render(); break;
    case 'filter': ui.filter = v; render(); break;
    case 'mfilter': ui.mfilter = v; render(); break;
    case 'more-hist': ui.histN += 60; render(); break;
    case 'abs':
      var d = V.date;
      if (!dayInfo(d).school) break;
      commit(['absences', d, id], isAbs(d, id) ? null : true); render(); break;
    case 'day-prev': V.date = addDays(V.date, -1); render(); break;
    case 'day-next': V.date = addDays(V.date, 1); render(); break;
    case 'day-today': V.date = todayISO(); render(); break;
    case 'edit-price': priceForm(); break;
    case 'edit-year': yearForm(); break;
    case 'add-closed': closedForm(); break;
    case 'del-closed':
      var c = S.joursFermes[id]; if (!c) break;
      confirmSheet('Supprimer ce jour sans repas ?', (c.motif || 'Jour sans repas') + ' (' + fmtDate(c.debut) + (c.fin && c.fin !== c.debut ? ' → ' + fmtDate(c.fin) : '') + '). Les repas de ces jours seront de nouveau débités.', 'Supprimer', function () {
        commit(['joursFermes', id], null); toast('Supprimé.'); render();
      }); break;
    case 'export': doExport(); break;
    case 'share': doShare(); break;
    case 'import-click': var fi = document.getElementById('import-file'); if (fi) fi.click(); break;
    case 'sync-now': syncState = 'attente'; syncing = false; sync(); toast('Synchronisation lancée.'); break;
    case 'sheet-close': closeSheet(); break;
  }
});
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'q') { ui.q = t.value; var l = document.getElementById('list'); if (l) l.innerHTML = studentListHtml(); }
  if (t.id === 'mq') { ui.mq = t.value; var m = document.getElementById('mlist'); if (m) m.innerHTML = mealListHtml(); }
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.id === 'meal-date' && validISO(t.value)) { V.date = t.value; render(); }
  if (t.id === 'import-file' && t.files && t.files[0]) { doImport(t.files[0]); t.value = ''; }
});
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { V.date = V.name === 'meals' ? V.date : todayISO(); sync(); } });
window.addEventListener('online', function () { syncing = false; sync(); });
window.addEventListener('offline', function () { if (FIREBASE_CONFIG) { syncState = 'horsligne'; refreshIfIdle(); } });
setInterval(function () { if (document.visibilityState === 'visible') sync(); }, 120000);

/* ---------- Démarrage ---------- */
loadLocal();
ensureDefaults();
try { history.replaceState({ name: 'home', id: null, date: V.date }, ''); } catch (e) { /* ignore */ }
render();
sync();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(function () { /* hors ligne non disponible */ });
}
// pour les tests
window.__christy = { get S() { return S; }, balanceOf: balanceOf, ctx: ctx, todayISO: todayISO, commit: commit, render: render, go: go, dayInfo: dayInfo };
})();
</script>

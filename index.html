<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4F7A17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Christy">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Les délices de Christy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F8EF; --ink:#16231D; --muted:#55655D; --line:#DDE3DE; --card:#FFFFFF;
  --accent:#4F7A17; --accent-t:#EBF3D9; --ok-bg:#E8F1D3; --ok:#3B5A0F;
  --warn-bg:#FDE8D5; --warn-line:#F1C7A0; --warn:#9A3F0C; --neutral-bg:#E3E7E4;
  --head:'Bricolage Grotesque',system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
a{color:inherit;text-decoration:none}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;background:var(--bg)}
main{flex:1;min-height:0;overflow-y:auto;padding:16px 20px 28px;display:flex;flex-direction:column;gap:14px}
nav{display:flex;flex-shrink:0;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-height:64px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--muted);font-size:11px;font-weight:500;cursor:pointer}
nav button.on{color:var(--accent);font-weight:700}
h1{margin:0;font:700 30px/1.15 var(--head)}
h2{margin:0;font:600 19px/1.2 var(--head)}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.row{display:flex;align-items:center;gap:12px}
.between{justify-content:space-between}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.card.warn{background:var(--warn-bg);border-color:var(--warn-line);color:var(--warn)}
.card.accent{background:var(--accent);border-color:var(--accent);color:#fff}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.stat .lbl{font-size:13px;color:var(--muted)}
.stat .val{font:700 28px/1.2 var(--head)}
.stat .sub{font-size:12px;color:var(--muted)}
.card.warn .lbl,.card.warn .sub{color:var(--warn)}
.list{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:0 16px}
.item{display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;padding:0;text-align:left;cursor:pointer}
.list > :last-child{border-bottom:0}
.item.static{cursor:default}
.avatar{width:40px;height:40px;border-radius:20px;background:var(--accent-t);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0}
.avatar.big{width:52px;height:52px;border-radius:26px;font-size:18px}
.name{font-size:16px;font-weight:500}
.neg{color:var(--warn);font-weight:700} .pos{color:var(--accent);font-weight:700}
.pill{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.bad{background:var(--warn-bg);color:var(--warn)} .pill.neutral{background:var(--neutral-bg);color:var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 18px;border-radius:14px;border:2px solid var(--accent);background:#fff;color:var(--accent);font-weight:700;font-size:16px;cursor:pointer;text-align:center}
.btn.primary{background:var(--accent);color:#fff}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn.small{min-height:44px;padding:0 14px;font-size:14px;border-radius:10px}
.btn[disabled],.btn.disabled{opacity:.45;pointer-events:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border:1px solid #C9D1CC;border-radius:999px;background:#fff;color:#3E4C45;font-size:14px;font-weight:500;cursor:pointer}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:14px;font-weight:500}
.field input,.field select,.field textarea{width:100%;height:52px;padding:0 14px;border:1px solid #C9D1CC;border-radius:12px;background:#fff}
.search{position:relative}
.search svg{position:absolute;left:14px;top:16px}
.search input{width:100%;height:52px;padding:0 16px 0 44px;border:1px solid #C9D1CC;border-radius:14px;background:#fff}
.back{display:flex;align-items:center;gap:4px;min-height:44px;color:var(--accent);font-weight:700;font-size:15px;background:none;border:0;padding:0;cursor:pointer;align-self:flex-start}
.chipbtn{display:flex;align-items:center;gap:4px;min-height:44px;margin:-12px 0;padding:0 12px;border:1px solid #C9D1CC;border-radius:999px;background:#fff;color:var(--accent);font-size:13px;font-weight:700;cursor:pointer}
.datebar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.roundbtn{width:44px;height:44px;border:1px solid #C9D1CC;border-radius:22px;background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
.absbtn{min-height:44px;padding:0 12px;border:1px solid #C9D1CC;border-radius:10px;background:#fff;color:#3E4C45;font-size:13px;font-weight:500;cursor:pointer}
.absbtn.on{border:2px solid #55655D;background:var(--neutral-bg);color:var(--ink);font-weight:700}
.logo{width:84px;height:65px;object-fit:contain;border-radius:10px;flex-shrink:0}
.seg{display:flex;background:#E3E7E4;border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;min-height:44px;border:0;border-radius:10px;background:none;font-weight:500;font-size:14px;color:#3E4C45;cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.bar{height:8px;border-radius:4px;background:var(--accent-t);overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent)}
.item.col2{align-items:stretch;padding:10px 0}
nav button{font-size:10.5px}
.overlay{position:fixed;inset:0;background:rgba(22,35,29,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;max-height:92vh;max-height:92dvh;display:flex;flex-direction:column;background:#fff;border-radius:20px 20px 0 0;z-index:21;padding-bottom:env(safe-area-inset-bottom)}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:14px 20px 4px}
.sheet-b{padding:8px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.sheet-f{display:flex;gap:10px;padding:12px 20px 16px}
.sheet-f .btn{flex:1}
.x{width:44px;height:44px;border:0;background:none;font-size:28px;line-height:1;color:var(--muted);cursor:pointer}
.err{color:var(--warn);font-size:14px;font-weight:700;padding:0 20px;min-height:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.hist .item{min-height:56px}
.strike{text-decoration:line-through;color:var(--muted)}
.dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px;background:#C9D1CC}
.dot.ok{background:var(--accent)} .dot.bad{background:var(--warn)}
</style>
</head>
<body>

  if (syncState === 'local') return { cls: '', txt: 'Mode local : les données restent sur ce téléphone.' };
  if (syncState === 'ok') return { cls: 'ok', txt: 'Synchronisé avec Firebase.' };
  if (syncState === 'horsligne') return { cls: 'bad', txt: 'Hors connexion' + (n ? ' : ' + n + ' modification(s) en attente.' : '.') };
  if (syncState === 'erreur') return { cls: 'bad', txt: 'Erreur de synchronisation' + (syncError ? ' (' + syncError + ')' : '') + (n ? ' : ' + n + ' modification(s) en attente.' : '.') };
  return { cls: '', txt: 'Synchronisation en cours…' };
}

/* =====================================================================
   CALCULS
   ===================================================================== */
function yearsList() {
  return Object.values(S.annees).filter(function (a) { return validISO(a.debut) && validISO(a.fin); })
    .sort(function (a, b) { return a.debut < b.debut ? -1 : 1; });
}
function currentYear() {
  var all = Object.values(S.annees).sort(function (a, b) { return (a.debut || '') < (b.debut || '') ? -1 : 1; });
  return all.length ? all[all.length - 1] : null;
}
function yearLabel(y) {
  if (!y || !validISO(y.debut) || !validISO(y.fin)) return 'Année scolaire';
  var a = y.debut.slice(0, 4), b = y.fin.slice(0, 4);
  return a === b ? a : a + '–' + b;
}
function ctx() {
  if (cache) return cache;
  var days = [], seen = {}, closed = Object.values(S.joursFermes);
  yearsList().forEach(function (y) {
    var d = y.debut, guard = 0;
    while (d <= y.fin && guard++ < 800) {
      if (!isWeekend(d) && !seen[d] && !closed.some(function (c) { return d >= c.debut && d <= (c.fin || c.debut); })) { seen[d] = 1; days.push(d); }
      d = addDays(d, 1);
    }
  });
  days.sort();
  var prix = Object.values(S.prix).sort(function (a, b) { return a.depuis < b.depuis ? -1 : 1; });
  var price = {};
  days.forEach(function (d) { var m = 0; for (var i = 0; i < prix.length; i++) { if (prix[i].depuis <= d) m = prix[i].montant; } price[d] = m; });
  var vers = {};
  Object.values(S.versements).forEach(function (v) { (vers[v.eleve] = vers[v.eleve] || []).push(v); });
  cache = { days: days, price: price, vers: vers, prix: prix };
  return cache;
}
function priceOn(d) {
  var p = ctx().prix, m = 0;
  for (var i = 0; i < p.length; i++) { if (p[i].depuis <= d) m = p[i].montant; }
  return m;
}
function currentPrice() { return priceOn(todayISO()); }
function dayInfo(d) {
  var y = yearsList();
  if (!y.length) return { school: false, reason: 'Les dates de l’année scolaire ne sont pas encore entrées', code: 'noyear' };
  if (!y.some(function (a) { return d >= a.debut && d <= a.fin; })) return { school: false, reason: 'Hors année scolaire', code: 'outside' };
  if (isWeekend(d)) return { school: false, reason: 'Week-end', code: 'weekend' };
  var c = Object.values(S.joursFermes).filter(function (c) { return d >= c.debut && d <= (c.fin || c.debut); })[0];
  if (c) return { school: false, reason: 'Jour sans repas' + (c.motif ? ' : ' + c.motif : ''), code: 'closed' };
  return { school: true, reason: '', code: 'ok' };
}
function isAbs(d, id) { return !!(S.absences[d] && S.absences[d][id]); }
function eleveActiveOn(e, d) { return (e.depuis || '0000-00-00') <= d && (!e.retireLe || d < e.retireLe); }
function activeStudents(d) { return Object.values(S.eleves).filter(function (e) { return eleveActiveOn(e, d); }); }
function isRetired(e) { return !!e.retireLe && e.retireLe <= todayISO(); }
function balanceOf(e, upTo) {
  var c = ctx(), verse = 0, debit = 0, repas = 0, abs = 0, i;
  var vs = c.vers[e.id] || [];
  for (i = 0; i < vs.length; i++) { if (!vs[i].annule && vs[i].date <= upTo) verse += vs[i].montant; }
  var from = e.depuis || '0000-00-00', to = e.retireLe;
  for (i = 0; i < c.days.length; i++) {
    var d = c.days[i];
    if (d > upTo) break;
    if (d < from) continue;
    if (to && d >= to) break;
    if (isAbs(d, e.id)) { abs++; continue; }
    debit += c.price[d]; repas++;
  }
  return { solde: verse - debit, verse: verse, debit: debit, repas: repas, abs: abs };
}
function historyOf(e) {
  var t = todayISO(), c = ctx(), ev = [], i;
  (c.vers[e.id] || []).forEach(function (v) { if (v.date <= t) ev.push({ date: v.date, k: 0, type: 'v', v: v }); });
  var from = e.depuis || '0000-00-00', to = e.retireLe;
  for (i = 0; i < c.days.length; i++) {
    var d = c.days[i];
    if (d > t) break;
    if (d < from) continue;
    if (to && d >= to) break;
    ev.push({ date: d, k: 1, type: isAbs(d, e.id) ? 'abs' : 'meal', amt: c.price[d] });
  }
  ev.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.k - b.k; });
  var run = 0;
  ev.forEach(function (x) {
    if (x.type === 'v') { if (!x.v.annule) run += x.v.montant; }
    else if (x.type === 'meal') run -= x.amt;
    x.run = run;
  });
  return ev.reverse();
}
function waLink(e, solde) {
  var d = String(e.tel || '').replace(/[^\d]/g, '');
  if (d.indexOf('00') === 0) d = d.slice(2);
  if (d.length === 9) d = '237' + d;
  if (d.length < 8) return '';
  var prenom = String(e.nom || '').split(/\s+/)[0];
  var msg = 'Bonjour, le compte de ' + prenom + ' est à ' + fcfa(solde) + '. Merci de faire un versement. – Les délices de Christy';
  return 'https://wa.me/' + d + '?text=' + encodeURIComponent(msg);
}

/* ---------- Périodes et bilans ---------- */
function fmtShort(iso) { return new Date(toUTC(iso)).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', timeZone: 'UTC' }); }
function monthLabel(iso) { var s = new Date(toUTC(iso)).toLocaleDateString('fr-FR', { month: 'long', year: 'numeric', timeZone: 'UTC' }); return s.charAt(0).toUpperCase() + s.slice(1); }
function monthStart(iso) { return iso.slice(0, 8) + '01'; }
function monthEnd(iso) { return fromUTC(Date.UTC(+iso.slice(0, 4), +iso.slice(5, 7), 1) - 86400000); }
function shiftMonth(ym, n) { var d = ym + '-01'; return (n < 0 ? monthStart(addDays(d, -1)) : addDays(monthEnd(d), 1)).slice(0, 7); }
function periodRange(kind, ref) {
  var a, b, label;
  if (kind === 'week') { a = addDays(ref, -((dow(ref) + 6) % 7)); b = addDays(a, 6); label = 'Semaine du ' + fmtShort(a) + ' au ' + fmtShort(b); }
  else if (kind === 'month') { a = monthStart(ref); b = monthEnd(ref); label = monthLabel(ref); }
  else {
    var y = currentYear();
    if (y && validISO(y.debut) && validISO(y.fin)) { a = y.debut; b = y.fin; label = 'Année ' + yearLabel(y); }
    else { a = ref.slice(0, 4) + '-01-01'; b = ref.slice(0, 4) + '-12-31'; label = 'Année ' + ref.slice(0, 4); }
  }
  return { a: a, b: b, label: label };
}
function periodStats(e, a, b) {
  var t = todayISO(), end = b < t ? b : t, c = ctx(), repas = 0, abs = 0, debit = 0, i;
  var from = e.depuis || '0000-00-00', to = e.retireLe;
  for (i = 0; i < c.days.length; i++) {
    var d = c.days[i];
    if (d < a || d < from) continue;
    if (d > end) break;
    if (to && d >= to) break;
    if (isAbs(d, e.id)) { abs++; continue; }
    debit += c.price[d]; repas++;
  }
  var verse = 0;
  (c.vers[e.id] || []).forEach(function (v) { if (!v.annule && v.type === 'versement' && v.date >= a && v.date <= b) verse += v.montant; });
  return { repas: repas, abs: abs, debit: debit, verse: verse, solde: balanceOf(e, end).solde };
}
function businessStats(a, b) {
  var tot = { repas: 0, valeur: 0, recu: 0, dep: 0, dette: 0 }, cats = {};
  Object.values(S.eleves).forEach(function (e) {
    var s = periodStats(e, a, b);
    tot.repas += s.repas; tot.valeur += s.debit; tot.recu += s.verse;
    if (s.solde < 0) tot.dette += -s.solde;
  });
  Object.values(S.depenses).forEach(function (x) {
    if (x.date >= a && x.date <= b) { tot.dep += x.montant; cats[x.cat] = (cats[x.cat] || 0) + x.montant; }
  });
  return { tot: tot, cats: cats };
}
function schoolList() {
  var seen = {}, out = [];
  Object.values(S.eleves).forEach(function (e) { var k = norm(e.ecole); if (k && !seen[k]) { seen[k] = 1; out.push(String(e.ecole).trim()); } });
  return out.sort(function (a, b) { return norm(a) < norm(b) ? -1 : 1; });
}
function subLine(e) { return [e.ecole, e.classe].filter(Boolean).join(' · '); }
function catName(id) { return (S.categories[id] || {}).nom || 'Autre'; }

var V = { name: 'home', id: null, date: todayISO() };

  if (!e) return '<button type="button" class="back" data-act="nav" data-v="students">' + IC.left + 'Élèves</button><div class="card">Cet élève n’existe plus.</div>';
  var t = todayISO(), b = balanceOf(e, t), retired = isRetired(e), wa = waLink(e, b.solde);
  var hist = historyOf(e), shown = hist.slice(0, ui.histN);

      } else if (x.type === 'abs') {

        right = '<div class="muted">0 FCFA</div>';

      }

    }).join('') + '</div>';
    if (hist.length > shown.length) html += '<button type="button" class="btn" data-act="more-hist">Voir plus (' + (hist.length - shown.length) + ')</button>';
  }
  return html;
}

/* ---------- Bilans ---------- */
function reportStudentsHtml() {

    .map(function (e) { return { e: e, s: periodStats(e, P.a, P.b) }; })
    .filter(function (r) { return !isRetired(r.e) || r.s.repas || r.s.abs || r.s.verse || r.s.solde < 0; });
  rows.sort(function (x, y) { return x.s.solde - y.s.solde; });
  if (!rows.length) return '<div class="card small muted">Aucun élève.</div>';
  var tot = rows.reduce(function (a, r) { a.repas += r.s.repas; a.debit += r.s.debit; a.verse += r.s.verse; return a; }, { repas: 0, debit: 0, verse: 0 });
  return '<div class="card small"><div class="row between"><span>Repas servis</span><b>' + tot.repas + '</b></div><div class="row between"><span>Valeur des repas</span><b>' + fcfa(tot.debit) + '</b></div><div class="row between"><span>Versements reçus</span><b>' + fcfa(tot.verse) + '</b></div></div>' +
    '<div class="list">' + rows.map(function (r) {
      return '<button type="button" class="item" style="min-height:68px" data-act="open-student" data-id="' + esc(r.e.id) + '"><div class="col grow"><div class="name">' + esc(r.e.nom) + '</div><div class="tiny muted">' + esc(r.e.classe || '') + ' · ' + r.s.repas + ' repas' + (r.s.abs ? ' · ' + r.s.abs + ' abs.' : '') + '</div></div>' +
        '<div class="col" style="align-items:flex-end"><div class="' + (r.s.solde < 0 ? 'neg' : 'pos') + '">' + fcfa(r.s.solde) + '</div><div class="tiny muted">repas ' + num(r.s.debit) + ' · versé ' + num(r.s.verse) + '</div></div></button>';
    }).join('') + '</div>';
}
function reportSchoolsHtml(P) {
  var g = {}, order = [];
  Object.values(S.eleves).forEach(function (e) {
    var s = periodStats(e, P.a, P.b);
    if (isRetired(e) && !s.repas && !s.abs && !s.verse && s.solde >= 0) return;
    var k = norm(e.ecole), name = String(e.ecole || '').trim() || 'Sans école';
    if (!g[k]) { g[k] = { name: name, n: 0, repas: 0, debit: 0, verse: 0, dette: 0 }; order.push(k); }
    var x = g[k]; x.n++; x.repas += s.repas; x.debit += s.debit; x.verse += s.verse; if (s.solde < 0) x.dette += -s.solde;
  });
  if (!order.length) return '<div class="card small muted">Aucun élève.</div>';
  order.sort(function (a, b) { return g[b].debit - g[a].debit; });
  var max = Math.max.apply(null, order.map(function (k) { return g[k].debit; })) || 1;
  var hint = order.length === 1 && order[0] === '' ? '<div class="card small">Aucune école n’est encore notée. Ajoute l’école dans la fiche de chaque élève (bouton Modifier).</div>' : '';
  return hint + order.map(function (k) {

function splitLine(line, delim) {
  var out = [], cur = '', q = false, i;
  for (i = 0; i < line.length; i++) {
    var ch = line.charAt(i);
    if (ch === '"') { if (q && line.charAt(i + 1) === '"') { cur += '"'; i++; } else q = !q; }
    else if (ch === delim && !q) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map(function (x) { return x.trim(); });
}
function rowsToStudents(rows) {
  rows = rows.filter(function (r) { return r.some(function (c) { return String(c == null ? '' : c).trim(); }); })
    .map(function (r) { return r.map(function (c) { return c == null ? '' : String(c).trim(); }); });
  if (!rows.length) return [];
  var idx = { nom: 0, classe: 1, ecole: 2, tel: 3, solde: 4 }, head = rows[0].map(norm), isHead = false;
  var map = { nom: /^(nom|prenom|eleve|name)/, classe: /^(classe|class|niveau)/, ecole: /^(ecole|etablissement|school)/, tel: /^(tel|phone|numero|parent|whatsapp|contact)/, solde: /^(solde|balance|compte)/ };
  var found = {};
  head.forEach(function (h, c) { Object.keys(map).forEach(function (k) { if (found[k] == null && map[k].test(h)) { found[k] = c; } }); });
  if (found.nom != null || Object.keys(found).length >= 2) { isHead = true; Object.keys(idx).forEach(function (k) { idx[k] = found[k] != null ? found[k] : -1; }); if (idx.nom < 0) idx.nom = 0; rows.shift(); }
  function get(r, k) { return idx[k] >= 0 ? (r[idx[k]] || '') : ''; }
  return rows.map(function (r) {
    var raw = get(r, 'solde').replace(/[\s  ]/g, '').replace('−', '-').replace(',', '.'), m = raw.match(/^-?\d+/);
    return { nom: get(r, 'nom'), classe: get(r, 'classe'), ecole: get(r, 'ecole'), tel: get(r, 'tel'), solde: m ? parseInt(m[0], 10) : 0 };
  }).filter(function (r) { return r.nom; });
}

  if (!lines.length) return [];
  var delim = ';', best = -1;
  [';', ',', '\t'].forEach(function (d) { var n = lines[0].split(d).length; if (n > best) { best = n; delim = d; } });
  return lines.map(function (l) { return splitLine(l, delim); });
}
function loadXlsxLib() {
  if (window.XLSX) return Promise.resolve();
  return new Promise(function (res, rej) {
    var sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
    sc.onload = res; sc.onerror = function () { rej(new Error('lib')); };
    document.head.appendChild(sc);
  });
}
function doImportCsv(file) {
  var isXlsx = /\.xlsx?$/i.test(file.name || '');
  var rd = new FileReader();
  rd.onload = function () {
    if (!isXlsx) return showImport(rowsToStudents(csvToRows(String(rd.result || ''))));
    loadXlsxLib().then(function () {
      var wb = window.XLSX.read(rd.result, { type: 'array' });
      var ws = wb.Sheets[wb.SheetNames[0]];
      showImport(rowsToStudents(window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: '' })));
    }).catch(function () { toast('Lecture du fichier Excel impossible (connexion internet nécessaire). Enregistre-le en CSV UTF-8 et réessaie.'); });
  };
  if (isXlsx) rd.readAsArrayBuffer(file); else rd.readAsText(file);
}
function showImport(rows) {
  if (!rows.length) return toast('Aucun élève trouvé dans ce fichier.');
  var have = {}; Object.values(S.eleves).forEach(function (e) { have[norm(e.nom) + '|' + norm(e.classe) + '|' + norm(e.ecole)] = 1; });
  var fresh = [], seen = {};
  rows.forEach(function (r) { var k = norm(r.nom) + '|' + norm(r.classe) + '|' + norm(r.ecole); if (!have[k] && !seen[k]) { seen[k] = 1; fresh.push(r); } });
  if (!fresh.length) return toast('Tous les élèves de ce fichier existent déjà.');
  var y = currentYear(), dflt = y && validISO(y.debut) ? y.debut : todayISO();
  var body = '<div><b>' + fresh.length + '</b> élève' + (fresh.length > 1 ? 's' : '') + ' à importer' + (rows.length - fresh.length ? ' (' + (rows.length - fresh.length) + ' déjà présent ou en double, ignoré' + (rows.length - fresh.length > 1 ? 's' : '') + ')' : '') + '.</div>' +
    '<div class="small muted">Exemples : ' + fresh.slice(0, 3).map(function (r) { return esc(r.nom + ' (' + [r.ecole, r.classe].filter(Boolean).join(', ') + ')' + (r.solde ? ' ' + fcfa(r.solde) : '')); }).join(' · ') + '</div>' +
    field('depuis', 'Repas débités à partir du', input('depuis', 'date', dflt)) +
    '<div class="small muted">Le solde de chaque ligne est enregistré à cette date comme solde de départ.</div>';
  openSheet('Importer des élèves', body, {
    label: 'Importer', noFocus: true,
    onSubmit: function (fd) {
      var dep = String(fd.get('depuis') || '');
      if (!validISO(dep)) return 'La date n’est pas valide.';
      fresh.forEach(function (r) {
        var id = uid();
        commit(['eleves', id], { id: id, nom: r.nom, ecole: r.ecole, classe: r.classe, tel: r.tel, note: '', depuis: dep });
        if (r.solde) { var vid = uid(); commit(['versements', vid], { id: vid, eleve: id, date: dep, montant: r.solde, type: 'depart', note: '' }); }
      });
      toast(fresh.length + ' élève' + (fresh.length > 1 ? 's' : '') + ' importé' + (fresh.length > 1 ? 's' : '') + '.'); render(); return null;
    }
  });
}
function wipeForm() {
  openSheet('Tout effacer ?', '<div>Tous les élèves, versements, dépenses, menus, absences et dates seront supprimés, ici et dans Firebase. Cette action ne peut pas être annulée.</div>' +
    field('conf', 'Pour confirmer, écris EFFACER', input('conf', 'text', '', 'autocomplete="off" autocapitalize="characters"')), {
    label: 'Tout effacer', danger: true,
    onSubmit: function (fd) {
      if (String(fd.get('conf') || '').trim().toUpperCase() !== 'EFFACER') return 'Écris EFFACER pour confirmer.';
      S = emptyState(); touch();
      pending = FIREBASE_CONFIG ? [{ p: '__root', v: S }] : [];
      ensureDefaultsSafe(); saveLocal(); sync(); V.name = 'home'; toast('Toutes les données ont été effacées.'); render(); return null;
    }
  });
}

/* ---------- Sauvegarde ---------- */
function backupBlob() {
  var payload = { app: 'delices-de-christy', version: 1, exportedAt: new Date().toISOString(), data: S };
  return new Blob([JSON.stringify(payload, null, 1)], { type: 'application/json' });
}
function backupName() { return 'christy-sauvegarde-' + todayISO() + '.json'; }
function markBackup() { try { localStorage.setItem(LS_BACKUP, todayISO()); } catch (e) { /* ignore */ } }
function doExport() {
  var url = URL.createObjectURL(backupBlob()), a = document.createElement('a');
  a.href = url; a.download = backupName(); document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 1500);
  markBackup(); toast('Sauvegarde téléchargée.'); render();
}
function doShare() {
  var file;
  try { file = new File([backupBlob()], backupName(), { type: 'application/json' }); } catch (e) { return doExport(); }
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    navigator.share({ files: [file], title: 'Sauvegarde Les délices de Christy' }).then(function () { markBackup(); render(); }).catch(function () { /* annulé */ });
  } else { doExport(); }
}
function doImport(file) {
  var r = new FileReader();
  r.onload = function () {
    var obj;
    try { obj = JSON.parse(r.result); } catch (e) { return toast('Ce fichier n’est pas une sauvegarde valide.'); }
    var data = obj && obj.data ? obj.data : obj;
    if (!data || typeof data !== 'object' || !data.eleves) return toast('Ce fichier n’est pas une sauvegarde valide.');
    var n = Object.keys(data.eleves).length;
    confirmSheet('Restaurer la sauvegarde ?', 'Toutes les données actuelles seront remplacées par celles du fichier (' + n + ' élève' + (n > 1 ? 's' : '') + '). Cette action ne peut pas être annulée.', 'Restaurer', function () {
      S = normalizeState(data); touch();
      if (FIREBASE_CONFIG) pending = [{ p: '__root', v: S }]; else pending = [];
      ensureDefaultsSafe(); saveLocal(); sync(); toast('Sauvegarde restaurée.'); render();
    });
  };
  r.readAsText(file);
}

/* =====================================================================
   ÉVÉNEMENTS
   ===================================================================== */
document.addEventListener('click', function (ev) {
  var el = ev.target.closest('[data-act]'); if (!el) return;
  var act = el.getAttribute('data-act'), id = el.getAttribute('data-id'), v = el.getAttribute('data-v');
  switch (act) {
    case 'nav': ev.preventDefault(); go(v); break;
    case 'go-year': go('year'); break;
    case 'go-admin': go('admin'); break;
    case 'go-admin': go('admin'); break;
    case 'go-meals': go('meals'); break;
    case 'open-student': go('student', id); ui.histN = 40; break;
    case 'add-student': studentForm(null); break;
    case 'edit-student': studentForm(S.eleves[id]); break;
    case 'add-versement': if (id) versementForm(id); else pickStudentSheet(); break;
    case 'pick-eleve': closeSheet(); versementForm(id); break;
    case 'cancel-versement':
      var vv = S.versements[id]; if (!vv) break;
      confirmSheet('Annuler ce versement ?', 'Le versement de ' + fcfa(vv.montant) + ' du ' + fmtDay(vv.date) + ' sera marqué comme annulé. Il reste visible dans l’historique mais n’est plus compté.', 'Annuler le versement', function () {
        commit(['versements', id], Object.assign({}, vv, { annule: true })); toast('Versement annulé.'); render();
      }); break;
    case 'retire':
      var er = S.eleves[id]; if (!er) break;
      closeSheet();
      confirmSheet('Retirer ' + er.nom + ' ?', 'Il ne sera plus débité à partir d’aujourd’hui et disparaîtra de la liste du jour. Son historique et son solde restent consultables.', 'Retirer', function () {
        commit(['eleves', id], Object.assign({}, er, { retireLe: todayISO() })); toast(er.nom + ' retiré(e).'); render();
      }); break;
    case 'unretire':
      var eu = S.eleves[id]; if (!eu) break;
      var rec = Object.assign({}, eu); delete rec.retireLe;
      commit(['eleves', id], rec); closeSheet(); toast(eu.nom + ' est de nouveau dans la liste.'); render(); break;
    case 'filter': ui.filter = v; render(); break;
    case 'school': ui.school = v || ''; render(); break;
    case 'mfilter': ui.mfilter = v; render(); break;
    case 'more-hist': ui.histN += 60; render(); break;
    case 'abs':
      var d = V.date;
      if (!dayInfo(d).school) break;
      commit(['absences', d, id], isAbs(d, id) ? null : true); render(); break;
    case 'day-prev': V.date = addDays(V.date, -1); render(); break;
    case 'day-next': V.date = addDays(V.date, 1); render(); break;
    case 'day-today': V.date = todayISO(); render(); break;
    case 'edit-price': priceForm(); break;
    case 'edit-year': yearForm(); break;
    case 'add-closed': closedForm(); break;
    case 'del-closed':
      var c = S.joursFermes[id]; if (!c) break;
      confirmSheet('Supprimer ce jour sans repas ?', (c.motif || 'Jour sans repas') + ' (' + fmtDate(c.debut) + (c.fin && c.fin !== c.debut ? ' → ' + fmtDate(c.fin) : '') + '). Les repas de ces jours seront de nouveau débités.', 'Supprimer', function () {
        commit(['joursFermes', id], null); toast('Supprimé.'); render();
      }); break;
    case 'export': doExport(); break;
    case 'share': doShare(); break;
    case 'import-click': var fi = document.getElementById('import-file'); if (fi) fi.click(); break;
    case 'sync-now': syncState = 'attente'; syncing = false; sync(); toast('Synchronisation lancée.'); break;
    case 'go-dette': ui.filter = 'dette'; go('students'); break;
    case 'go-menus': go('menus'); break;
    case 'mref': ui.mref = addDays(ui.mref || todayISO(), 7 * parseInt(v, 10)); render(); break;
    case 'set-menu': menuForm(el.getAttribute('data-d')); break;
    case 'add-expense': expenseForm(null); break;
    case 'edit-expense': expenseForm(S.depenses[id]); break;
    case 'del-expense':
      var xd = S.depenses[id]; if (!xd) break;
      closeSheet();
      confirmSheet('Supprimer cette dépense ?', catName(xd.cat) + ' · ' + fcfa(xd.montant) + ' · ' + fmtDay(xd.date) + '.', 'Supprimer', function () { commit(['depenses', id], null); toast('Dépense supprimée.'); render(); });
      break;
    case 'emonth': ui.emonth = shiftMonth(ui.emonth || todayISO().slice(0, 7), parseInt(v, 10)); render(); break;
    case 'rkind': ui.rkind = v; render(); break;
    case 'rmode': ui.rmode = v; render(); break;
    case 'rprev': ui.rref = ui.rkind === 'week' ? addDays(ui.rref || todayISO(), -7) : shiftMonth((ui.rref || todayISO()).slice(0, 7), -1) + '-01'; render(); break;
    case 'rnext': ui.rref = ui.rkind === 'week' ? addDays(ui.rref || todayISO(), 7) : shiftMonth((ui.rref || todayISO()).slice(0, 7), 1) + '-01'; render(); break;
    case 'new-year': newYearForm(); break;
    case 'csv-click': var cf = document.getElementById('csv-file'); if (cf) cf.click(); break;
    case 'wipe': wipeForm(); break;
    case 'sheet-close': closeSheet(); break;
  }
});
document.addEventListener('input', function (ev) {
  var t = ev.target;
  if (t.id === 'q') { ui.q = t.value; var l = document.getElementById('list'); if (l) l.innerHTML = studentListHtml(); }
  if (t.id === 'rq') { ui.rq = t.value; var rl = document.getElementById('rlist'); if (rl) rl.innerHTML = reportStudentsHtml(); }
  if (t.id === 'mq') { ui.mq = t.value; var m = document.getElementById('mlist'); if (m) m.innerHTML = mealListHtml(); }
});
document.addEventListener('change', function (ev) {
  var t = ev.target;
  if (t.id === 'meal-date' && validISO(t.value)) { V.date = t.value; render(); }
  if (t.id === 'csv-file' && t.files && t.files[0]) { doImportCsv(t.files[0]); t.value = ''; }
  if (t.id === 'import-file' && t.files && t.files[0]) { doImport(t.files[0]); t.value = ''; }
});
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') { V.date = V.name === 'meals' ? V.date : todayISO(); sync(); } });
window.addEventListener('online', function () { syncing = false; sync(); });
window.addEventListener('offline', function () { if (FIREBASE_CONFIG) { syncState = 'horsligne'; refreshIfIdle(); } });
setInterval(function () { if (document.visibilityState === 'visible') sync(); }, 120000);

/* ---------- Démarrage ---------- */
loadLocal();
ensureDefaults();
try { history.replaceState({ name: 'home', id: null, date: V.date }, ''); } catch (e) { /* ignore */ }
render();
sync();
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(function () { /* hors ligne non disponible */ });
}
// pour les tests
window.__christy = { get S() { return S; }, balanceOf: balanceOf, ctx: ctx, todayISO: todayISO, commit: commit, render: render, go: go, dayInfo: dayInfo };
})();
</script>
